{% extends "base.html" %}

{% block title %}Support Ticketing{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-brand">Support Ticketing</div>
    <p class="auth-tagline">A shared ticket queue for support teams to track priority, SLA response times, and the full history behind every ticket.</p>
    <div class="pipeline">
        <div class="pipeline-row">
            <span class="pipeline-dot" style="--step-color: var(--status-new);"></span>
            <span class="pipeline-connector"></span>
            <span class="pipeline-dot" style="--step-color: var(--status-open);"></span>
            <span class="pipeline-connector"></span>
            <span class="pipeline-dot" style="--step-color: var(--status-pending);"></span>
            <span class="pipeline-connector"></span>
            <span class="pipeline-dot" style="--step-color: var(--status-resolved);"></span>
            <span class="pipeline-connector"></span>
            <span class="pipeline-dot" style="--step-color: var(--status-closed);"></span>
        </div>
        <div class="pipeline-labels">
            <span>New</span>
            <span>Open</span>
            <span>Pending</span>
            <span>Resolved</span>
            <span>Closed</span>
        </div>
    </div>
    <a href="/auth/login" class="btn btn-accent w-100">Sign in</a>
</div>
{% endblock %}
