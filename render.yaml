databases:
  - name: support-ticketing-db
    databaseName: support_ticketing
    plan: free

services:
  - type: web
    name: support-ticketing
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: support-ticketing-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
